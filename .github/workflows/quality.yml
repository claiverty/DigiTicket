name: Qualidade do projeto

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qualidade-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v6

      - name: Configurar o Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar as dependências
        run: npm ci

      - name: Validar a tipagem
        run: npm run lint

      - name: Gerar o build
        run: npm run build

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/digiticket_ci?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/digiticket_ci?schema=public
      FRONTEND_URL: http://localhost:5173
      JWT_SECRET: segredo-ficticio-do-ci-com-mais-de-32-caracteres
      JWT_EXPIRES_IN: 7d
      TICKET_SIGNING_SECRET: assinatura-ficticia-do-ci-com-mais-de-32-caracteres

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v6

      - name: Configurar o Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar as dependências
        run: npm ci

      - name: Validar o schema do Prisma
        run: npm run prisma:validate

      - name: Executar o lint
        run: npm run lint

      - name: Executar os testes unitários
        run: npm run test -- --runInBand

      - name: Executar os testes E2E
        run: npm run test:e2e -- --runInBand

      - name: Gerar o build
        run: npm run build
